<h2 mat-dialog-title>
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p class="text-sm text-white/65">
    {{ data.message }}
  </p>

  @if (data.warning) {
    <p class="mt-2 text-sm text-white/45">
      {{ data.warning }}
    </p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>

  <button mat-stroked-button type="button" (click)="confirm()">
    {{ data.confirmText }}
  </button>
</mat-dialog-actions>
